      drawBox(DEV_UNKNOWN_RECT, DEV_UNKNOWN, 20, false);
      if (performance.now() < devMsgUntil) text(devMsg, W / 2, 330, 16);
      text("Takılabilir maks. can: " + maxEquip, W / 2, 356, 13);
      drawBox(BTN_BACK, ">", 26, false);
    } else if (state === "mod") {
      drawModScreen();
    } else if (state === "graph") {
      text("Grafikler", W / 2, 90, 26);
      text("Şu an: " + (quality === "high" ? "Yüksek" : quality === "mid" ? "Orta" : "Düşük"), W / 2, 130, 15);
      drawBox(BTN_QLOW, "Düşük (sade, hızlı)", 14, quality === "low");
      drawBox(BTN_QMID, "Orta (gerçekçi, efektli)", 14, quality === "mid");
      drawBox(BTN_QHIGH, "Yüksek (en güzel)", 14, quality === "high");
      text("Yüksek grafik eski telefonları yorabilir", W / 2, 306, 11);
      drawBox(BTN_BACK, ">", 26, false);
    } else if (state === "reset") {
      text("Verileri sıfırla?", W / 2, 150, 22);
      text("Coin, elmas, zümrüt, can, kuş,", W / 2, 190, 13);
      text("rekor ve istatistikler silinir.", W / 2, 210, 13);
      text("Bu işlem geri alınamaz.", W / 2, 230, 13);
      drawBox(BTN_RESET_YES, "Evet, sıfırla", 16, false);
      drawBox(BTN_RESET_NO, "Vazgeç", 16, false);
    } else if (state === "ready") {
      text("Başlamak için dokun", W / 2, 320, 15);
      drawSpeedUI();
      if (modBtnVisible()) drawBox(BTN_INGAME_MOD, destroyMode ? "YOK: AÇIK" : "YOK: KAPALI", 10, destroyMode);
    } else if (state === "play") {
      text(String(score), W / 2, 60, 40 + popT * 2);
      text("REKOR: " + best, W / 2, 96, 14);
      drawWallet(114, W / 2);
      if (slowOn) text("YAVAŞ ÇEKİM", W / 2, 132, 11);
      if (boostT > 0) {
        ctx.fillStyle = "rgba(120,220,255,0.12)";
        ctx.fillRect(0, 0, W, H);
        text("BOOST " + Math.ceil(boostT / 30), W / 2, 150, 16);
      }
      if (boosts > 0 || boostT > 0) drawBox(BTN_BOOST_INGAME, boostT > 0 ? "BOOST" : "BOOST " + boosts, 10, boostT > 0);
      if (skin === "eagle" && !cheat) text("KARTAL GÖRÜŞÜ", 6, 44, 11, "left");
      if (skin === "ninja" && !cheat) text("NİNJA GÖRÜŞÜ", 6, 44, 11, "left");
      if (bannerT > 0) {
        ctx.globalAlpha = Math.min(1, bannerT / 20);
        text("SEVİYE " + score, W / 2, 200, 22);
        ctx.globalAlpha = 1;
      }
      drawSpeedUI();
      if (modBtnVisible()) drawBox(BTN_INGAME_MOD, destroyMode ? "YOK: AÇIK" : "YOK: KAPALI", 10, destroyMode);
    } else {
      text("GAME OVER", W / 2, 180, 30);
      text("SKOR: " + score, W / 2, 220, 20);
      text("REKOR: " + best, W / 2, 248, 18);
      if (newRecord) text("YENİ REKOR!", W / 2, 276, 20);
      text("Bu tur: +" + roundCoins + " coin, +" + roundDiamonds + " elmas, +" + roundEmeralds + " zümrüt", W / 2, 300, 11);
      if (performance.now() - overAt > 600) text("Menü için dokun", W / 2, 330, 15);
    }

    if (state === "ready" || state === "play" || state === "over") drawFloats();

    if (atLeast("high")) {
      var vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.75);
      vg.addColorStop(0, "rgba(0,0,0,0)");
      vg.addColorStop(1, "rgba(0,0,0,0.3)");
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }

    ctx.restore();

    if (fade > 0.01) {
      ctx.fillStyle = "rgba(0,0,0," + fade.toFixed(3) + ")";
      ctx.fillRect(0, 0, W, H);
    }
  }

  // mod menu: sik panel, bolum basliklari, renkli butonlar
  function drawModScreen() {
    var P = MOD_PANEL;
    var pg = ctx.createLinearGradient(0, P.y, 0, P.y + P.h);
    pg.addColorStop(0, "rgba(58,28,98,0.95)");
    pg.addColorStop(1, "rgba(10,5,24,0.95)");
    ctx.fillStyle = pg;
    rr(P.x, P.y, P.w, P.h, 14);
    ctx.fill();
    ctx.strokeStyle = "#f5d76e";
    ctx.lineWidth = 2;
    ctx.stroke();

    text("★ MOD MENÜ ★", W / 2, 42, 18);
    ctx.strokeStyle = "rgba(245,215,110,0.6)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(50, 52); ctx.lineTo(W - 50, 52); ctx.stroke();

    drawBox(mr(66), "Miktar: " + modAmt(), 12, false);
    text("KAYNAKLAR", W / 2, 90, 10);
    drawBox(mhL(100), "Coin +" + modAmt(), 11, false);
    drawBox(mhR(100), "Coin −" + modAmt(), 11, false);
    drawBox(mhL(126), "Elmas +" + modAmt(), 11, false);
    drawBox(mhR(126), "Elmas −" + modAmt(), 11, false);
    drawBox(mhL(152), "Zümrüt +" + modAmt(), 11, false);
    drawBox(mhR(152), "Zümrüt −" + modAmt(), 11, false);
    drawBox(mhL(178), "Boost +" + modAmt(), 11, false);
    drawBox(mhR(178), "Boost −" + modAmt(), 11, false);
    drawBox(mhL(204), "Can +" + modAmt(), 11, false);
    drawBox(mhR(204), "Can −" + modAmt(), 11, false);
    text("SANDIK VER (+1)", W / 2, 236, 10);
    drawBox(mtri(0, 246), "Kristal", 10, false);
    drawBox(mtri(1, 246), "Alev", 10, false);
    drawBox(mtri(2, 246), "Zümrüt", 10, false);
    text("AYARLAR", W / 2, 276, 10);
    drawBox(mr(288), "Tüm kuşları ve şapkaları aç", 11, false);
    drawBox(mr(314), "Hile: " + (cheat ? "AÇIK" : "KAPALI"), 11, cheat);
    drawBox(mr(340), "Yok etme: " + (destroyMode ? "AÇIK" : "KAPALI"), 11, destroyMode);
    drawBox(mr(366), modHidden ? "Oyun içi mod butonunu göster" : "Oyun içi mod butonunu gizle", 10, false);

    text("Maks can: " + maxEquip + "  |  Takılı: " + equipped + "  |  Boost: " + boosts, W / 2, 404, 10);
    if (modMsg) text(modMsg, W / 2, 420, 11);
    drawWallet(442);
    drawBox(BTN_BACK, ">", 26, false);
  }

  // ===== ANA DONGU =====
  function frame(t) {
    if (last === null) last = t;
    acc += Math.min(t - last, 250);
    last = t;

    var inGame = (state === "ready" || state === "play" || state === "over");
    var stepMs = STEP / (inGame ? speed : 1);
    while (acc >= stepMs) {
      snapPos();
      update();
      acc -= stepMs;
    }

    if (state === "over" && performance.now() - overAt > 2500) goMenu();
    if (fade > 0) fade *= 0.85;

    // akicilik: 30 Hz mantik, ekranda iki adim arasi yumusak cizim
    var interpOn = (state === "play" || state === "ready");
    var alpha = interpOn ? Math.min(1, acc / stepMs) : 0;
    if (interpOn) interpPos(alpha, true);
    draw();
    if (interpOn) interpPos(alpha, false);
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
